# nginx-achiri.conf — Sprint 1160
#
# Nginx reverse proxy for Achiri API on Hetzner VPS.
# Routes public HTTPS traffic to achiri-api PM2 process (localhost:3420).
#
# Install:
#   sudo cp scripts/achiri/nginx-achiri.conf /etc/nginx/sites-available/achiri
#   sudo ln -s /etc/nginx/sites-available/achiri /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d achiri.kognai.com   # get SSL cert
#   sudo nginx -t && sudo nginx -s reload
#
# Prerequisites:
#   - Domain: achiri.kognai.com → 65.108.90.178 (DNS A record)
#   - certbot: sudo apt install certbot python3-certbot-nginx
#   - achiri-api PM2 process running on localhost:3420

upstream achiri_backend {
    server 127.0.0.1:3420;
    keepalive 16;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name achiri.kognai.com;
    return 301 https://$host$request_uri;
}

# HTTPS + reverse proxy
server {
    listen 443 ssl http2;
    server_name achiri.kognai.com;

    # SSL — managed by certbot (will be auto-updated below)
    ssl_certificate     /etc/letsencrypt/live/achiri.kognai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/achiri.kognai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # Request size limits (voice uploads up to 25MB)
    client_max_body_size 25M;
    client_body_timeout  30s;
    send_timeout         30s;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # Main API routes
    location / {
        proxy_pass http://achiri_backend;
    }

    # Health check — allow unauthenticated, low rate
    location /stats/health {
        proxy_pass http://achiri_backend;
        limit_req zone=healthcheck burst=5 nodelay;
    }

    # Voice endpoint — larger timeout for audio
    location /voice {
        proxy_pass http://achiri_backend;
        proxy_read_timeout 120s;
    }

    # Logs
    access_log /var/log/nginx/achiri-access.log;
    error_log  /var/log/nginx/achiri-error.log;
}

# Rate limiting zones (define in http{} block in nginx.conf if not present)
# http {
#     limit_req_zone $binary_remote_addr zone=healthcheck:1m rate=10r/m;
# }
