# Achiri API — Nginx proxy config (Sprint 129)
# Include in main Hetzner nginx config:
#   include /home/invoica/apps/kognai/infra/nginx-achiri.conf;
#
# Achiri HTTP API runs on localhost:3420 (PM2: achiri-api)
# Public routes: /achiri/*

# Rate limiting zone — 20 req/s per IP for Achiri
limit_req_zone $binary_remote_addr zone=achiri:10m rate=20r/s;

location /achiri/ {
    # Strip /achiri prefix and proxy to local port
    rewrite ^/achiri(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3420;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts — voice processing may take ~10s
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Rate limit (burst 5 requests)
    limit_req zone=achiri burst=5 nodelay;

    # CORS headers for Achiri web clients
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # Handle CORS preflight
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "*";
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }
}

# Direct health check (no auth, for uptime monitoring)
location = /achiri/health {
    rewrite ^/achiri(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3420;
    proxy_set_header Host $host;
    access_log off;
}
